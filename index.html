<!DOCTYPE html>
<html>

<head>
    <title>Horse Bounce!</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link href="https://cdn.jsdelivr.net/npm/featherlight@1.7.14/release/featherlight.min.css" rel="stylesheet">
</head>
   

<body class="overflow-hidden text-[#5c3a21]">

    
    <div id="canvas" class="fixed inset-0 bg-cover bg-bottom cursor-grab bg-[url(https://wallpaperbat.com/img/447590-sunset-fields-4k-plains-wallpaper-4k-3840x2160-wallpaper.jpg)]"></div>

   
    <div class="fixed top-0 left-0 w-full pt-6 text-center pointer-events-none">

        <h1 class="text-5xl md:text-7xl text-[#fff387]">
            Horse Bounce!
        </h1>
                <p class="mt-2 mb-4 px-4 text-[#e7da9f]">
            Drag and throw the horses. Click one for a dad joke or a horse fact. Find the rare golden horse!
        </p>

        <div>
            <button id="add-horse" class="pointer-events-auto bg-[#3e5c35] hover:bg-[#b8913f] text-[#f5efe0] text-sm uppercase tracking-wider px-4 py-2 m-1 rounded cursor-pointer">Add Horse</button>
            <button id="rain-button" class="pointer-events-auto bg-[#3e5c35] hover:bg-[#b8913f] text-[#f5efe0] text-sm uppercase tracking-wider px-4 py-2 m-1 rounded cursor-pointer">Make It Rain Horses</button>
            <button id="shake-button" class="pointer-events-auto bg-[#3e5c35] hover:bg-[#b8913f] text-[#f5efe0] text-sm uppercase tracking-wider px-4 py-2 m-1 rounded cursor-pointer">Giddy Up!</button>
            <button id="gravity-toggle" class="pointer-events-auto bg-[#3e5c35] hover:bg-[#b8913f] text-[#f5efe0] text-sm uppercase tracking-wider px-4 py-2 m-1 rounded cursor-pointer">Gravity: On</button>
            <button id="clear-button" class="pointer-events-auto bg-[#3e5c35] hover:bg-[#b8913f] text-[#f5efe0] text-sm uppercase tracking-wider px-4 py-2 m-1 rounded cursor-pointer">Clear Paddock</button>
        </div>

        <p id="counter" class="text-sm tracking-wider mt-3 text-[#fae98a]">
            Horses in the paddock: 0
        </p>
             

    </div>
    <div class="hidden">

        <div id="joke-box" class="max-w-sm text-center">
            <p id="joke-label" class="text-sm text-[#3e5c35]"></p>
            <img id="joke-image" src="" alt="" class="w-24 mx-auto my-2">
            <p id="joke-text" class="text-xl"></p>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/featherlight@1.7.14/release/featherlight.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
